<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playwright Report Dashboard</title>
  <meta name="description" content="Navigate and filter Playwright JSON test reports stored in storage/." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem('pwd-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <rect x="2" y="2" width="28" height="28" rx="8" class="brand-bg" />
          <path d="M9 17.5l4.2 4.2L23 11.8" class="brand-check" />
        </svg>
        <div>
          <div class="brand-name">PW Reports</div>
          <div class="brand-sub">Playwright dashboard</div>
        </div>
      </div>

      <nav class="nav" aria-label="Views">
        <a href="#/overview" data-nav="overview">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6v8H3zM11 3h6v5h-6zM11 10h6v7h-6zM3 13h6v4H3z"/></svg>
          Overview
        </a>
        <a href="#/tests" data-nav="tests">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h12"/></svg>
          Tests
          <span class="nav-count" id="nav-test-count"></span>
        </a>
        <a href="#/runs" data-nav="runs">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15l4-5 3 3 4-6 3 4"/></svg>
          Runs &amp; history
        </a>
      </nav>

      <div class="sidebar-section">
        <div class="sidebar-heading">
          <span>Spec files</span>
          <button class="link-btn" id="clear-file" hidden>All</button>
        </div>
        <div class="file-tree" id="file-tree" role="tree" aria-label="Spec files"></div>
      </div>

      <div class="sidebar-foot">
        <span id="pw-version"></span>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
        </button>

        <div class="run-picker">
          <label for="run-select" class="visually-hidden">Report run</label>
          <select id="run-select"></select>
          <span class="run-meta" id="run-meta"></span>
        </div>

        <div class="topbar-actions">
          <label class="btn btn-ghost" title="Open a Playwright JSON report from your computer">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3M6 7l4-4 4 4M4 13v4h12v-4"/></svg>
            <span class="btn-label">Load report</span>
            <input type="file" id="file-input" accept=".json,application/json" hidden />
          </label>
          <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode" title="Toggle theme">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 0 7 7 5.5 5.5 0 0 1-7-7z"/></svg>
          </button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1" aria-live="polite">
        <div class="loading"><span class="spinner"></span> Loading reports…</div>
      </main>
    </div>
  </div>

  <div class="drop-overlay" id="drop-overlay" hidden>
    <div class="drop-card">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3M6 7l4-4 4 4M4 13v4h12v-4"/></svg>
      Drop a Playwright <code>results.json</code> to open it
    </div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
